<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Telegram Vault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="vault-header">
      <div class="header-top">
        <div>
          <h1 id="vaultTitle">My Vault</h1>
          <p class="subtitle" id="vaultStats">Loading your personal files...</p>
        </div>
        <div class="header-actions">
          <button class="icon-btn hidden" id="pinHomeBtn" title="Pin Vault to Home Screen">📲</button>
          <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
        </div>
      </div>

      <!-- Search & Sort Controls -->
      <div class="controls-row">
        <input type="search" id="searchInput" placeholder="Search your files, batches, notes..." autocomplete="off" />
        <select id="sortSelect" aria-label="Sort items">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name_asc">Name A–Z</option>
          <option value="name_desc">Name Z–A</option>
          <option value="downloads">Most Opened</option>
        </select>
      </div>

      <!-- Category Filter Pills -->
      <div class="filter-pills" id="filterPills">
        <button class="pill active" data-type="all">All</button>
        <button class="pill" data-type="single">Files</button>
        <button class="pill" data-type="batch">Batches</button>
        <button class="pill" data-type="text">Texts</button>
      </div>
    </header>

    <!-- Items List -->
    <main id="itemsList" class="items-list">
      <div class="empty-state">Loading your stored items...</div>
    </main>
  </div>

  <!-- Edit / Rename & Link Rules Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalHeading">Edit Item</h2>
      <label class="field-label" for="editTitleInput">Title / Name</label>
      <input type="text" id="editTitleInput" maxlength="120" />

      <div id="editTextGroup" class="hidden">
        <label class="field-label" for="editTextContent">Text Content</label>
        <textarea id="editTextContent" rows="5"></textarea>
      </div>

      <!-- Link Rules Toggle Section -->
      <div class="rules-box">
        <div class="rules-header" id="toggleRulesBtn">
          <span>⚙️ Link Rules (PIN, Expiry & Self-Destruct)</span>
          <span id="rulesChevron">▼</span>
        </div>
        <div id="rulesContent" class="rules-body hidden">
          <label class="field-label" for="rulePinInput">4-Digit PIN Lock (leave blank for none)</label>
          <input type="text" id="rulePinInput" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" />

          <label class="field-label" for="ruleExpirySelect">Auto-Expire Link</label>
          <select id="ruleExpirySelect">
            <option value="0">Never Expire</option>
            <option value="1">Expire after 1 Hour</option>
            <option value="24">Expire after 24 Hours</option>
            <option value="168">Expire after 7 Days</option>
          </select>

          <label class="field-label" for="ruleMaxDownloads">Self-Destruct After X Opens (0 = Unlimited)</label>
          <input type="number" id="ruleMaxDownloads" min="0" max="1000" placeholder="e.g. 1 for 1-time view" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
        <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- QR Code Share Modal -->
  <div id="qrModal" class="modal hidden">
    <div class="modal-card qr-card">
      <h2 id="qrTitle">Scan QR Code</h2>
      <p class="subtitle">Scan with your phone or PC camera to open this vault link</p>
      <div id="qrCanvas" class="qr-box"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeQrBtn">Close</button>
        <button class="btn btn-primary" id="copyQrLinkBtn">Copy Link</button>
      </div>
    </div>
  </div>

  <!-- In-App Media Preview Modal -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="previewTitle">Media Preview</h2>
      <div id="previewContainer" class="preview-box">Loading preview...</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closePreviewBtn">Close</button>
        <button class="btn btn-primary" id="sendFromPreviewBtn">📥 Send to Chat</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
